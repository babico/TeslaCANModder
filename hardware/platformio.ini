; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno
src_dir = src

[env]
lib_deps =
    https://github.com/autowp/arduino-mcp2515.git#v1.3.1
lib_ldf_mode = deep+
monitor_speed = 115200
; Optional Uno Bluetooth transport:
;   - default AVR behavior enables HC-05 support on D4/D5
;   - add `-DBOARD_ENABLE_BT=0` to build a USB-only image
; Canonical firmware code lives directly under hardware/lib:
;   - hardware/lib/board
;   - hardware/lib/can
;   - hardware/lib/drivers
;   - hardware/lib/handlers
;   - hardware/lib/packages

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = 
    -Ilib
    -DDRIVER_ARDUINO_MCP2515
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_BT=1
test_ignore =
    test_native_helpers
    test_native_hw3
    test_native_hw4
    test_native_legacy
    test_native_twai

[env:native]
platform = native
test_framework = unity
build_flags =
    -Ilib
test_build_src = no
lib_ignore =
    autowp-mcp2515
