; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno
src_dir = src

[env]
lib_deps =
    https://github.com/autowp/arduino-mcp2515.git#v1.3.1
monitor_speed = 115200
lib_ldf_mode = deep+
; Simplified firmware structure:
;   - hardware/lib/config.h
;   - hardware/lib/types.h
;   - hardware/lib/can.h
;   - hardware/lib/driver.h
;   - hardware/lib/handlers.h
;   - hardware/lib/bridge.h


# usb
[env:uno_usb]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -Ilib
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_BT=0
    -DBOARD_ENABLE_MCP2515_2=0

# usb+bt
[env:uno_usb_bt]
platform = atmelavr
board = uno
framework = arduino
build_flags = 
    -Ilib
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_BT=1
    -DBOARD_ENABLE_MCP2515_2=0

# usb+2nd_mcp2515
[env:uno_usb_mcp2]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -Ilib
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_BT=0
    -DBOARD_ENABLE_MCP2515_2=1

# usb+bt+2nd_mcp2515 (full)
[env:uno_full]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -Ilib
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_BT=1
    -DBOARD_ENABLE_MCP2515_2=1
