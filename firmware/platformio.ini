; ═══════════════════════════════════════════════════════════════════════════════
; ── ESP32 HARDWARE TEST ENVIRONMENTS ──────────────────────────────────────────
; Run on physical ESP32 DevKit with MCP2515 connected (CS=15, INT=34).
; CAN tests use MCP2515 loopback mode — no external CAN bus wiring needed.
; ═══════════════════════════════════════════════════════════════════════════════

[env:test_esp32_can_driver]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    ${addon_clock_8mhz.build_flags}
    ${addon_bus_chassis.build_flags}
    -DBOARD_ENABLE_WIFI=0
    -DBOARD_ENABLE_BLE=0
test_framework = unity
test_build_src = true
test_filter = test_esp32_can_driver

[env:test_esp32_can_loopback]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    ${addon_clock_8mhz.build_flags}
