; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Environment naming convention ───────────────────────────────────────────
;
;   esp32[_wifi][_ble][_chassis][_vehicle][_body][_8mhz|_16mhz]
;
;   Segments (all optional, order fixed):
;     _wifi      BOARD_ENABLE_WIFI=1    — REST API + dashboard
;     _ble       BOARD_ENABLE_BLE=1     — NimBLE UART NUS + gamepad central
;     _chassis   BUS_CHASSIS_ACTIVE=1   — Chassis CAN      (X179 pins 13-14)
;     _vehicle   BUS_VEHICLE_ACTIVE=1   — Vehicle Ctrl CAN (X179 pins  9-10)
;     _body      BUS_BODY_ACTIVE=1      — Body Ctrl CAN    (X179 pins  2-3)
;     _8mhz      BOARD_CAN_CLOCK_MHZ=8  — 8 MHz MCP2515 crystal  (most modules)
;     _16mhz     BOARD_CAN_CLOCK_MHZ=16 — 16 MHz MCP2515 crystal (some modules)
;
;   ALL buses are opt-in per environment — no bus is hardcoded active.
;   Chassis CAN is opt-in just like every other bus; omit _chassis to build
;   a passive sniffer/logger that only listens on vehicle/body.
;   DAS injection only works when _chassis is included (that is where the
;   steering and braking ECUs listen).
;   Every env has an explicit clock suffix; nothing is implied by omission.
;
; ── Bus wiring reference ─────────────────────────────────────────────────────
;
;   BUS_CHASSIS  CS=15 INT=34   X179 pins 13-14  (opt-in — needed for DAS)
;   BUS_VEHICLE  CS=27 INT=35   X179 pins  9-10  (opt-in)
;   BUS_BODY     CS=26 INT=33   X179 pins  2-3   (opt-in)
;
; ── To add a custom combination ──────────────────────────────────────────────
;
;   [env:esp32_my_custom_env]
;   extends = esp32_base
;   build_flags =
;       ${esp32_base.build_flags}
;       ${addon_clock_8mhz.build_flags}
;       ${addon_bus_chassis.build_flags}
;       ${addon_wifi.build_flags}
;       -DBOARD_ENABLE_BLE=0

[platformio]
default_envs = esp32_chassis_8mhz
src_dir = src

[env]
extra_scripts = post:scripts/rename_firmware.py
lib_deps =
    https://github.com/autowp/arduino-mcp2515.git#v1.3.1
monitor_speed = 115200
lib_ldf_mode = deep+
lib_compat_mode = off

; ═══════════════════════════════════════════════════════════════════════════════
; Native Host Tests (no hardware needed)
; ═══════════════════════════════════════════════════════════════════════════════
; Authoritative sources (edit these):
;   test/native/{core,vehicle,transport,interface}/*.cpp
;
; Run `python scripts/gen_test_wrappers.py` after adding/removing tests.
; Wrappers: test/test_native_<feature>/test_<feature>.cpp
; ═══════════════════════════════════════════════════════════════════════════════
[env:native]
platform = native
build_flags =
    -Ilib
    -Ilib/vehicle/can
    -Itest/support
    -std=c++17
    -DBUS_CHASSIS_ACTIVE=1
    -DBUS_VEHICLE_ACTIVE=1
    -DBUS_BODY_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_WIFI=0
    -DBOARD_ENABLE_BLE=0
lib_deps =
    throwtheswitch/Unity@2.6.0
lib_ldf_mode = off
build_src_filter = -<*>

; ═══════════════════════════════════════════════════════════════════════════════
; Shared base sections
; ═══════════════════════════════════════════════════════════════════════════════

; ── Hardware base (all ESP32 targets) ────────────────────────────────────────
; NOTE: No buses or clock set here — every env adds them explicitly via addons.
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
build_flags =
    -Ilib
    -Ilib/vehicle/can
lib_deps =
    https://github.com/autowp/arduino-mcp2515.git#v1.3.1
    bblanchon/ArduinoJson@7.0.0
    Preferences
    WiFi
    WebServer
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter = +<esp32/main.cpp>

; ── CAN clock add-ons ────────────────────────────────────────────────────────
[addon_clock_8mhz]
build_flags = -DBOARD_CAN_CLOCK_MHZ=8

[addon_clock_16mhz]
build_flags = -DBOARD_CAN_CLOCK_MHZ=16

; ── Connectivity add-ons ─────────────────────────────────────────────────────
[addon_wifi]
extra_scripts =
    pre:scripts/embed_html.py
    post:scripts/rename_firmware.py
build_flags = -DBOARD_ENABLE_WIFI=1

[addon_ble]
lib_deps = h2zero/NimBLE-Arduino@1.4.0
build_flags = -DBOARD_ENABLE_BLE=1

; ── Bus add-ons (all buses are opt-in — none is hardcoded active) ────────────
[addon_bus_chassis]
; Chassis CAN — X179 pins 13-14.  CS=15 INT=34.
; Required for DAS injection (steering/braking/ACC ECUs listen here).
build_flags = -DBUS_CHASSIS_ACTIVE=1

[addon_bus_vehicle]
; Vehicle Control CAN — X179 pins 9-10.  CS=27 INT=35.
; BMS, climate, powertrain telemetry.
build_flags = -DBUS_VEHICLE_ACTIVE=1

[addon_bus_body]
; Body Control CAN — X179 pins 2-3.  CS=26 INT=33.
; Windows, sentry mode, trunk, lighting.
build_flags = -DBUS_BODY_ACTIVE=1

; ═══════════════════════════════════════════════════════════════════════════════
; ── SERIAL ONLY (no WiFi, no BLE) ─────────────────────────────────────────────
; ═══════════════════════════════════════════════════════════════════════════════

; Chassis only — minimal / FSD-only
[env:esp32_chassis_8mhz]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    ${addon_clock_8mhz.build_flags}
    ${addon_bus_chassis.build_flags}
    -DBOARD_ENABLE_WIFI=0
    -DBOARD_ENABLE_BLE=0

; Chassis + Vehicle
