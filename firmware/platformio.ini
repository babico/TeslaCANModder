; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno
src_dir = src

[env]
extra_scripts = post:scripts/rename_firmware.py
lib_deps =
    https://github.com/autowp/arduino-mcp2515.git#v1.3.1
monitor_speed = 115200
lib_ldf_mode = deep+
lib_compat_mode = off

; ═══════════════════════════════════════════════════════════════════════════════
; Native Host Tests (no hardware needed)
; ═══════════════════════════════════════════════════════════════════════════════
[env:native]
platform = native
build_flags =
    -Ilib
    -Itest/support
    -std=c++17
    -DBUS_CHASSIS_ACTIVE=1
    -DBUS_VEHICLE_ACTIVE=1
    -DBUS_BODY_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_WIFI=0
    -DBOARD_ENABLE_BLE=0
lib_deps =
    throwtheswitch/Unity@2.6.0
lib_ldf_mode = off
build_src_filter = -<*>
; Directory-based firmware structure:
;   firmware/lib/core/config/{uno,esp32}.h
;   firmware/lib/core/driver/{uno,esp32}.h
;   firmware/lib/core/persist/{uno,esp32}.h
;   firmware/lib/io/serial/{uno,esp32}.h
;   firmware/lib/io/bluetooth/esp32.h
;   firmware/lib/io/wifi/esp32.h
;   firmware/lib/handler/dispatch/{uno,esp32}.h
;   firmware/src/uno/main.cpp
;   firmware/src/esp32/main.cpp


; ═══════════════════════════════════════════════════════════════════════════════
; Arduino Uno Environments
; Bus activation injected by build server: -DBUS_CHASSIS_ACTIVE=1 etc.
; Default: FSD only (BUS_CHASSIS_ACTIVE=1, others=0)
; ═══════════════════════════════════════════════════════════════════════════════

# uno - serial only
[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<uno/main.cpp>
build_flags =
    -Ilib
    -DBUS_CHASSIS_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_BT=0

# uno + bt
[env:uno_bt]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<uno/main.cpp>
build_flags =
    -Ilib
    -DBUS_CHASSIS_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_BT=1

; ═══════════════════════════════════════════════════════════════════════════════
; ESP32-S DevKit Environments
; Tesla X179 Connector (fixed pin positions):
;   Bus 0 (MCP2515_1): X179 pins 13-14 → FSD CAN
;   Bus 1 (MCP2515_2): X179 pins 9-10  → Vehicle Control CAN
;   Bus 2 (MCP2515_3): X179 pins 2-3   → Body Control CAN
;
; Bus activation injected by build server: -DBUS_CHASSIS_ACTIVE=1 etc.
; Default: FSD only
; ═══════════════════════════════════════════════════════════════════════════════

[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
lib_deps =
    https://github.com/autowp/arduino-mcp2515.git#v1.3.1
    bblanchon/ArduinoJson@7.0.0
    Preferences
    WiFi
    WebServer
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter = +<esp32/main.cpp>

# esp32 - serial only
[env:esp32]
extends = esp32_common
build_flags =
    -Ilib
    -DBUS_CHASSIS_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_WIFI=0
    -DBOARD_ENABLE_BLE=0

# esp32 + wifi
[env:esp32_wifi]
extends = esp32_common
extra_scripts =
    pre:scripts/embed_html.py
    post:scripts/rename_firmware.py
build_flags =
    -Ilib
    -DBUS_CHASSIS_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_WIFI=1
    -DBOARD_ENABLE_BLE=0

# esp32 + ble
[env:esp32_ble]
extends = esp32_common
lib_deps =
    ${esp32_common.lib_deps}
    h2zero/NimBLE-Arduino@1.4.0
build_flags =
    -Ilib
    -DBUS_CHASSIS_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_WIFI=0
    -DBOARD_ENABLE_BLE=1

# esp32 + wifi + ble (full)
[env:esp32_wifi_ble]
extends = esp32_common
extra_scripts =
    pre:scripts/embed_html.py
    post:scripts/rename_firmware.py
lib_deps =
    ${esp32_common.lib_deps}
    h2zero/NimBLE-Arduino@1.4.0
build_flags =
    -Ilib
    -DBUS_CHASSIS_ACTIVE=1
    -DBOARD_CAN_CLOCK_MHZ=8
    -DBOARD_ENABLE_WIFI=1
    -DBOARD_ENABLE_BLE=1
