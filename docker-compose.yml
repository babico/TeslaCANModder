services:
  firmware:
    build:
      context: .
      dockerfile: hardware/Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    environment:
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "4173:4173"
    volumes:
      - .:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "4173", "--strictPort"]
    depends_on:
      - firmware
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4173/heartbeat.json >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-prod:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: production
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/heartbeat.json >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
