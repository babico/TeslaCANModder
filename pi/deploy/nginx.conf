# TeslaCANModder Pi portal — nginx sites-enabled snippet.
#
# Install path: /etc/nginx/sites-available/tcm-portal, symlinked from sites-enabled.
# Debian/Raspberry Pi OS include sites-enabled inside the distro http{} block, so this
# file intentionally has no worker_processes/events/http wrapper: only map, upstream,
# and server directives (valid in http{} context) live here.
#
# Render with envsubst (only this variable is substituted; nginx variables are left intact):
#   SENTRY_USB_PORT='<UNVERIFIED: actual Sentry USB local port>' \
#       envsubst '${SENTRY_USB_PORT}' < pi/deploy/nginx.conf \
#       > /etc/nginx/sites-available/tcm-portal
#
# Sentry USB's local port is UNVERIFIED in this repo. Ask the maintainer for the
# real loopback port. Never point that upstream at a non-loopback address.
# Both upstreams are loopback-only: the token-bearing bridge must not be directly
# reachable from the LAN. This file does not touch Sentry USB configuration.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# External service. Port is UNVERIFIED; rendered from SENTRY_USB_PORT.
upstream sentry_usb {
    # UNVERIFIED: Sentry USB local port; injected from SENTRY_USB_PORT at render time.
    server 127.0.0.1:${SENTRY_USB_PORT};
    keepalive 8;
}

# A3 Pi command bridge. Fixed loopback port shared with tcm-can.service.
upstream tcm_can {
    server 127.0.0.1:8090;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Public entry point: Sentry USB UI. Proxy only; no shared static root.
    location / {
        proxy_pass http://sentry_usb;
        proxy_http_version 1.1;
        # sentry_usb uses upstream keepalive; drop the client hop-by-hop header.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canonical URL for our client. Trailing slash makes proxy_pass strip the
    # /tcm prefix, so A3 sees /health, /status, /api/command as designed.
    location = /tcm {
        return 301 /tcm/;
    }

    # Our client/static bundle and A3 API on the same origin.
    location /tcm/ {
        proxy_pass http://tcm_can/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
