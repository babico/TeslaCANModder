name: OpenCode Issue Triage

on:
    issues:
        types: [opened]

jobs:
    triage:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
            pull-requests: read
            issues: write
        steps:
            - name: Check account age
              id: check
              uses: actions/github-script@v7
              with:
                  script: |
                      const user = await github.rest.users.getByUsername({
                        username: context.payload.issue.user.login
                      });
                      const created = new Date(user.data.created_at);
                      const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
                      return days >= 30;
                  result-encoding: string

            - uses: actions/checkout@v6
              if: steps.check.outputs.result == 'true'
              with:
                  persist-credentials: false

            - uses: anomalyco/opencode/github@latest
              if: steps.check.outputs.result == 'true'
              env:
                  # OpenCode Go subscription
                  OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
                  # Fallback: Anthropic
                  # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              with:
                  model: opencode-go/kimi-k2.6
                  prompt: |
                      Review this TeslaCANModder issue and provide helpful triage:

                      - Categorize the issue (bug, feature request, question, documentation)
                      - Check if it's related to: firmware, client, protocol, tools, docs, or hardware
                      - Suggest relevant documentation from docs/ if applicable
                      - For bugs: ask for reproduction steps, environment, and variant (HW3/HW4/Legacy)
                      - For feature requests: check if similar features exist in docs/reference/commands.md
                      - For CAN-related issues: reference docs/reference/can-protocol.md and docs/troubleshooting/debug-guide.md
                      - Label appropriately if you can

                      Be concise but helpful. If the issue is unclear, ask clarifying questions.
                      Do not comment if the issue is spam or completely off-topic.
