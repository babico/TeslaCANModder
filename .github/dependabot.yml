version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 10

    - package-ecosystem: "npm"
      directory: "/client"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5

    - package-ecosystem: "npm"
      directory: "/packages/protocol"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5

    - package-ecosystem: "npm"
      directory: "/tools"
      schedule:
          interval: "weekly"
      open-pull-requests-limit: 5

    - package-ecosystem: "docker"
      directory: "/hardware"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 3

    - package-ecosystem: "docker"
      directory: "/web"
      schedule:
          interval: "monthly"
      open-pull-requests-limit: 3
