server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /heartbeat.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"ok":true,"service":"TeslaCANModder-web","mode":"production"}';
  }

  location /api/build {
    # Use a variable so nginx resolves the upstream lazily at request time
    # rather than at startup (prevents emerg when firmware container is absent).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $firmware_upstream http://firmware:8100;
    proxy_pass $firmware_upstream/build;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
