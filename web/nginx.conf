server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /heartbeat.json {
    default_type application/json;
    add_header Cache-Control "no-store";
    return 200 '{"ok":true,"service":"TeslaCANModder-web","mode":"production"}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
